name: Deploy to Production

# Trigger su push a production, develop, o feature branch
on:
  push:
    branches:
      - production
      - develop
      - claude/deploy-hetzner-Hvdwg
  workflow_dispatch:  # Permette trigger manuale da UI GitHub

env:
  NODE_VERSION: '20'
  ANSIBLE_VERSION: '8.7.0'  # ansible 8.x corresponds to ansible-core 2.15

jobs:
  # ═══════════════════════════════════════════════════════
  # JOB 1: Test e Build (CI)
  # ═══════════════════════════════════════════════════════

  test:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: studio-erp/package-lock.json

      - name: Install dependencies
        working-directory: studio-erp
        run: npm ci

      - name: Lint code
        working-directory: studio-erp
        run: npm run lint
        continue-on-error: true  # Non blocca deploy per warning lint

      - name: Generate Prisma Client
        working-directory: studio-erp
        run: npx prisma generate

      - name: Build Next.js
        working-directory: studio-erp
        run: npm run build
        env:
          # Build-time env vars (pubbliche)
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: |
            studio-erp/.next
            studio-erp/node_modules
          retention-days: 1

  # ═══════════════════════════════════════════════════════
  # JOB 2: Security Scan (SAST)
  # ═══════════════════════════════════════════════════════

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Snyk security scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --file=studio-erp/package.json
        continue-on-error: true  # Non blocca deploy (solo alert)

      - name: Run npm audit
        working-directory: studio-erp
        run: |
          npm audit --audit-level=high || echo "npm audit found vulnerabilities"
        continue-on-error: true

  # ═══════════════════════════════════════════════════════
  # JOB 3: Deploy con Ansible (CD)
  # ═══════════════════════════════════════════════════════

  deploy:
    name: Deploy to Hetzner
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    environment: production  # Require manual approval (GitHub Environment protection rules)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible==${{ env.ANSIBLE_VERSION }}
          ansible --version

      - name: Install Ansible Galaxy collections
        run: |
          ansible-galaxy collection install community.general
          ansible-galaxy collection install community.postgresql
          ansible-galaxy collection install ansible.posix

      - name: Configure SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Open SSH on Hetzner Cloud Firewall
        run: |
          API="https://api.hetzner.cloud/v1"
          TOKEN="${{ secrets.HETZNER_API_TOKEN }}"
          FW_REF="${{ secrets.HETZNER_FIREWALL_ID }}"
          if [ -z "$FW_REF" ]; then
            echo "⚠️  HETZNER_FIREWALL_ID not set — skipping firewall open"
            exit 0
          fi
          # Resolve firewall: if numeric use as ID directly, otherwise look up by name
          if echo "$FW_REF" | grep -qE '^[0-9]+$'; then
            FW_ID="$FW_REF"
          else
            echo "Looking up firewall by name: $FW_REF"
            HTTP_CODE=$(curl -s -o /tmp/hetzner_fw_list.json -w "%{http_code}" \
              -H "Authorization: Bearer $TOKEN" \
              "$API/firewalls?name=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$FW_REF")")
            if [ "$HTTP_CODE" != "200" ]; then
              echo "❌ GET /firewalls?name=$FW_REF returned HTTP $HTTP_CODE"
              cat /tmp/hetzner_fw_list.json
              exit 1
            fi
            FW_ID=$(jq -r '.firewalls[0].id // empty' /tmp/hetzner_fw_list.json)
            if [ -z "$FW_ID" ]; then
              echo "❌ No firewall found with name '$FW_REF'"
              echo "Available firewalls in this project:"
              curl -s -H "Authorization: Bearer $TOKEN" "$API/firewalls" \
                | jq -r '.firewalls[] | "  ID: \(.id)  Name: \(.name)"'
              exit 1
            fi
            echo "Resolved firewall '$FW_REF' → ID $FW_ID"
          fi
          # GET current rules
          HTTP_CODE=$(curl -s -o /tmp/hetzner_fw_get.json -w "%{http_code}" \
            -H "Authorization: Bearer $TOKEN" "$API/firewalls/$FW_ID")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ GET /firewalls/$FW_ID returned HTTP $HTTP_CODE"
            cat /tmp/hetzner_fw_get.json
            echo ""
            echo "Available firewalls in this project:"
            curl -s -H "Authorization: Bearer $TOKEN" "$API/firewalls" \
              | jq -r '.firewalls[] | "  ID: \(.id)  Name: \(.name)"'
            exit 1
          fi
          jq '.firewall.rules' /tmp/hetzner_fw_get.json > /tmp/hetzner_original_rules.json
          echo "Saved $(jq length /tmp/hetzner_original_rules.json) existing rule(s)"
          # Build new rules: remove any existing TCP port 22 rule, then add SSH from 0.0.0.0/0
          NEW_RULES=$(jq '[.[] | select(.protocol != "tcp" or .port != "22")] + [{"direction":"in","port":"22","protocol":"tcp","source_ips":["0.0.0.0/0","::/0"]}]' \
            /tmp/hetzner_original_rules.json)
          # POST new rules
          HTTP_CODE=$(curl -s -o /tmp/hetzner_fw_set.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            "$API/firewalls/$FW_ID/actions/set_rules" \
            -d "{\"rules\": $NEW_RULES}")
          if [ "$HTTP_CODE" != "201" ]; then
            echo "❌ POST set_rules returned HTTP $HTTP_CODE"
            cat /tmp/hetzner_fw_set.json
            exit 1
          fi
          # Save resolved numeric ID for the close step
          echo "$FW_ID" > /tmp/hetzner_fw_id.txt
          echo "✅ SSH rule added. Waiting 30s for propagation..."
          sleep 30

      - name: Verify SSH connectivity
        run: |
          IP="${{ secrets.PRODUCTION_SERVER_IP }}"
          if [ -z "$IP" ]; then
            echo "❌ PRODUCTION_SERVER_IP secret is not set"
            exit 1
          fi
          echo "Checking SSH connectivity to $IP (max 10 attempts, 15s apart)..."
          for i in $(seq 1 10); do
            if nc -z -w 5 "$IP" 22 2>/dev/null; then
              echo "✅ Port 22 reachable on attempt $i"
              mkdir -p ~/.ssh
              ssh-keyscan -H "$IP" >> ~/.ssh/known_hosts 2>/dev/null
              exit 0
            fi
            echo "Attempt $i/10 failed — waiting 15s..."
            sleep 15
          done
          echo "❌ Cannot reach $IP:22 after 10 attempts."
          echo "   Check: Hetzner Cloud Firewall allows port 22 from 0.0.0.0/0"
          echo "   Check: server is provisioned and running"
          echo "   Check: PRODUCTION_SERVER_IP secret contains the correct IP"
          exit 1

      - name: Create Ansible Vault password file
        run: |
          echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > studio-erp/ansible/.vault_pass
          chmod 600 studio-erp/ansible/.vault_pass

      - name: Create encrypted vault file
        env:
          VAULT_PG_PASSWORD: ${{ secrets.POSTGRESQL_PASSWORD }}
          VAULT_NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          VAULT_STRIPE_PK: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          VAULT_STRIPE_SK: ${{ secrets.STRIPE_SECRET_KEY }}
          VAULT_STRIPE_WH: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          VAULT_SENDGRID: ${{ secrets.SENDGRID_API_KEY }}
          VAULT_OPENAI: ${{ secrets.OPENAI_API_KEY }}
          VAULT_UPSTASH_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          VAULT_UPSTASH_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          VAULT_SENTRY: ${{ secrets.SENTRY_DSN }}
          VAULT_HETZNER: ${{ secrets.HETZNER_API_TOKEN }}
          VAULT_BACKUP_PASS: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
          VAULT_GRAFANA_PASS: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        run: |
          set -e
          python3 - << 'PYEOF'
          import os, yaml
          data = {
              'vault_postgresql_password': os.environ.get('VAULT_PG_PASSWORD', ''),
              'vault_nextauth_secret': os.environ.get('VAULT_NEXTAUTH_SECRET', ''),
              'vault_nextauth_url': 'https://romanoing.com',
              'vault_stripe_publishable_key': os.environ.get('VAULT_STRIPE_PK', ''),
              'vault_stripe_secret_key': os.environ.get('VAULT_STRIPE_SK', ''),
              'vault_stripe_webhook_secret': os.environ.get('VAULT_STRIPE_WH', ''),
              'vault_sendgrid_api_key': os.environ.get('VAULT_SENDGRID', ''),
              'vault_openai_api_key': os.environ.get('VAULT_OPENAI', ''),
              'vault_upstash_redis_rest_url': os.environ.get('VAULT_UPSTASH_URL', ''),
              'vault_upstash_redis_rest_token': os.environ.get('VAULT_UPSTASH_TOKEN', ''),
              'vault_sentry_dsn': os.environ.get('VAULT_SENTRY', ''),
              'vault_hetzner_api_token': os.environ.get('VAULT_HETZNER', ''),
              'vault_backup_encryption_passphrase': os.environ.get('VAULT_BACKUP_PASS', ''),
              'vault_grafana_admin_password': os.environ.get('VAULT_GRAFANA_PASS', ''),
          }
          with open('studio-erp/ansible/group_vars/production/vault.yml', 'w') as f:
              yaml.dump(data, f, default_flow_style=False, allow_unicode=True)
          PYEOF
          ansible-vault encrypt studio-erp/ansible/group_vars/production/vault.yml \
            --vault-password-file studio-erp/ansible/.vault_pass

      - name: Update inventory with server IP
        run: |
          sed -i "s/XXX.XXX.XXX.XXX/${{ secrets.PRODUCTION_SERVER_IP }}/g" studio-erp/ansible/inventory/production.yml

      - name: Run Ansible deployment (application only)
        working-directory: studio-erp/ansible
        run: |
          set -e  # Exit on error
          echo "Starting Ansible deployment..."

          ansible-playbook playbooks/application.yml \
            --vault-password-file .vault_pass \
            --tags deploy \
            -v

          echo "✅ Ansible deployment completed successfully"

      - name: Wait for application startup
        run: |
          echo "Waiting 45 seconds for application to fully start..."
          sleep 45
          echo "✅ Wait complete"

      - name: Health check (HTTP only)
        continue-on-error: true  # Don't fail deployment
        run: |
          echo "Starting health checks via HTTP..."

          # Try health check endpoint with retries
          SUCCESS=false
          for i in {1..12}; do
            echo "Health check attempt $i/12..."
            if curl -f --connect-timeout 15 --max-time 30 https://romanoing.com/api/health 2>/dev/null; then
              echo "✅ Health check PASSED!"
              SUCCESS=true
              break
            fi
            echo "⏳ Waiting 10 seconds before retry..."
            sleep 10
          done

          if [ "$SUCCESS" = false ]; then
            echo "⚠️  Health check didn't pass after 12 attempts (~2 minutes)"
            echo "📝 This may be normal - application might still be starting"
            echo "🔗 Verify manually at: https://romanoing.com"
            echo "📊 Or check via IP: http://116.203.109.249"
          fi

          # Always exit 0 to not block deployment
          exit 0

      - name: Notify Sentry deployment
        if: success()
        run: |
          curl -X POST https://sentry.io/api/0/organizations/studio-romano/releases/ \
            -H "Authorization: Bearer ${{ secrets.SENTRY_AUTH_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "version": "${{ github.sha }}",
              "projects": ["studio-erp"],
              "refs": [{
                "repository": "${{ github.repository }}",
                "commit": "${{ github.sha }}"
              }]
            }' || echo "Sentry notification failed (non-blocking)"

      - name: Cleanup sensitive files
        if: always()
        run: |
          rm -f studio-erp/ansible/.vault_pass
          rm -f studio-erp/ansible/group_vars/production/vault.yml
          rm -f ~/.ssh/id_rsa

      - name: Close SSH on Hetzner Cloud Firewall
        if: always()
        run: |
          if [ ! -f /tmp/hetzner_original_rules.json ] || [ ! -f /tmp/hetzner_fw_id.txt ]; then
            echo "No saved firewall state, skipping restore"
            exit 0
          fi
          API="https://api.hetzner.cloud/v1"
          TOKEN="${{ secrets.HETZNER_API_TOKEN }}"
          FW_ID=$(cat /tmp/hetzner_fw_id.txt)
          ORIGINAL_RULES=$(cat /tmp/hetzner_original_rules.json)
          HTTP_CODE=$(curl -s -o /tmp/hetzner_fw_restore.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            "$API/firewalls/$FW_ID/actions/set_rules" \
            -d "{\"rules\": $ORIGINAL_RULES}")
          if [ "$HTTP_CODE" != "201" ]; then
            echo "❌ Restore set_rules returned HTTP $HTTP_CODE"
            cat /tmp/hetzner_fw_restore.json
            exit 1
          fi
          echo "✅ Firewall rules restored"
          rm -f /tmp/hetzner_original_rules.json /tmp/hetzner_fw_id.txt \
                /tmp/hetzner_fw_get.json /tmp/hetzner_fw_set.json /tmp/hetzner_fw_restore.json

  # ═══════════════════════════════════════════════════════
  # JOB 4: Post-Deployment Verification
  # ═══════════════════════════════════════════════════════

  verify:
    name: Post-Deployment Tests
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Wait for application warmup
        run: sleep 15

      - name: Test public endpoints
        continue-on-error: true  # Don't fail deployment if tests timeout
        run: |
          # Homepage
          echo "Testing homepage..."
          curl -f -s -o /dev/null -w "%{http_code}" --connect-timeout 15 --max-time 30 https://romanoing.com | grep "200" || echo "⚠️ Homepage test failed"

          # Health check
          echo "Testing health endpoint..."
          curl -f --connect-timeout 15 --max-time 30 https://romanoing.com/api/health || echo "⚠️ Health check failed"

          # Bundle catalog API (public)
          echo "Testing bundle API..."
          curl -f --connect-timeout 15 --max-time 30 https://romanoing.com/api/bundle || echo "⚠️ Bundle API test failed"

      - name: Test SSL/TLS configuration
        continue-on-error: true  # Don't fail deployment if SSL tests timeout
        run: |
          # Verifica certificato SSL valido
          echo "Testing SSL certificate..."
          timeout 30 openssl s_client -connect romanoing.com:443 -servername romanoing.com < /dev/null 2>/dev/null | \
            openssl x509 -noout -dates || echo "⚠️ SSL certificate test failed"

          # Verifica TLS 1.2+
          echo "Testing TLS version..."
          curl -v --connect-timeout 15 --tlsv1.2 https://romanoing.com 2>&1 | grep "TLSv1.[23]" || echo "⚠️ TLS version test failed"

      - name: Test security headers
        continue-on-error: true  # Don't fail deployment if header tests timeout
        run: |
          echo "Testing security headers..."
          # HSTS
          curl -s -I --connect-timeout 15 https://romanoing.com | grep -i "strict-transport-security" || echo "⚠️ HSTS header missing"

          # X-Frame-Options
          curl -s -I --connect-timeout 15 https://romanoing.com | grep -i "x-frame-options" || echo "⚠️ X-Frame-Options header missing"

          # X-Content-Type-Options
          curl -s -I --connect-timeout 15 https://romanoing.com | grep -i "x-content-type-options" || echo "⚠️ X-Content-Type-Options header missing"

      - name: Run Lighthouse CI (performance)
        continue-on-error: true  # Don't fail deployment if Lighthouse times out
        uses: treosh/lighthouse-ci-action@v10
        with:
          urls: |
            https://romanoing.com
          uploadArtifacts: true
          temporaryPublicStorage: true

  # ═══════════════════════════════════════════════════════
  # JOB 5: Rollback (solo su fallimento)
  # ═══════════════════════════════════════════════════════

  rollback:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: [deploy, verify]
    if: failure()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history per rollback

      - name: Setup Python & Ansible
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ansible
        run: pip install ansible==${{ env.ANSIBLE_VERSION }}

      - name: Configure SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Open SSH on Hetzner Cloud Firewall
        run: |
          API="https://api.hetzner.cloud/v1"
          TOKEN="${{ secrets.HETZNER_API_TOKEN }}"
          FW_REF="${{ secrets.HETZNER_FIREWALL_ID }}"
          if [ -z "$FW_REF" ]; then
            echo "⚠️  HETZNER_FIREWALL_ID not set — skipping firewall open"
            exit 0
          fi
          # Resolve firewall: if numeric use as ID directly, otherwise look up by name
          if echo "$FW_REF" | grep -qE '^[0-9]+$'; then
            FW_ID="$FW_REF"
          else
            echo "Looking up firewall by name: $FW_REF"
            HTTP_CODE=$(curl -s -o /tmp/hetzner_fw_list.json -w "%{http_code}" \
              -H "Authorization: Bearer $TOKEN" \
              "$API/firewalls?name=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$FW_REF")")
            if [ "$HTTP_CODE" != "200" ]; then
              echo "❌ GET /firewalls?name=$FW_REF returned HTTP $HTTP_CODE"
              cat /tmp/hetzner_fw_list.json
              exit 1
            fi
            FW_ID=$(jq -r '.firewalls[0].id // empty' /tmp/hetzner_fw_list.json)
            if [ -z "$FW_ID" ]; then
              echo "❌ No firewall found with name '$FW_REF'"
              echo "Available firewalls in this project:"
              curl -s -H "Authorization: Bearer $TOKEN" "$API/firewalls" \
                | jq -r '.firewalls[] | "  ID: \(.id)  Name: \(.name)"'
              exit 1
            fi
            echo "Resolved firewall '$FW_REF' → ID $FW_ID"
          fi
          # GET current rules
          HTTP_CODE=$(curl -s -o /tmp/hetzner_fw_get.json -w "%{http_code}" \
            -H "Authorization: Bearer $TOKEN" "$API/firewalls/$FW_ID")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ GET /firewalls/$FW_ID returned HTTP $HTTP_CODE"
            cat /tmp/hetzner_fw_get.json
            echo ""
            echo "Available firewalls in this project:"
            curl -s -H "Authorization: Bearer $TOKEN" "$API/firewalls" \
              | jq -r '.firewalls[] | "  ID: \(.id)  Name: \(.name)"'
            exit 1
          fi
          jq '.firewall.rules' /tmp/hetzner_fw_get.json > /tmp/hetzner_original_rules.json
          echo "Saved $(jq length /tmp/hetzner_original_rules.json) existing rule(s)"
          # Build new rules: remove any existing TCP port 22 rule, then add SSH from 0.0.0.0/0
          NEW_RULES=$(jq '[.[] | select(.protocol != "tcp" or .port != "22")] + [{"direction":"in","port":"22","protocol":"tcp","source_ips":["0.0.0.0/0","::/0"]}]' \
            /tmp/hetzner_original_rules.json)
          # POST new rules
          HTTP_CODE=$(curl -s -o /tmp/hetzner_fw_set.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            "$API/firewalls/$FW_ID/actions/set_rules" \
            -d "{\"rules\": $NEW_RULES}")
          if [ "$HTTP_CODE" != "201" ]; then
            echo "❌ POST set_rules returned HTTP $HTTP_CODE"
            cat /tmp/hetzner_fw_set.json
            exit 1
          fi
          # Save resolved numeric ID for the close step
          echo "$FW_ID" > /tmp/hetzner_fw_id.txt
          echo "✅ SSH rule added. Waiting 30s for propagation..."
          sleep 30

      - name: Verify SSH connectivity
        run: |
          IP="${{ secrets.PRODUCTION_SERVER_IP }}"
          if [ -z "$IP" ]; then
            echo "❌ PRODUCTION_SERVER_IP secret is not set"
            exit 1
          fi
          echo "Checking SSH connectivity to $IP (max 10 attempts, 15s apart)..."
          for i in $(seq 1 10); do
            if nc -z -w 5 "$IP" 22 2>/dev/null; then
              echo "✅ Port 22 reachable on attempt $i"
              mkdir -p ~/.ssh
              ssh-keyscan -H "$IP" >> ~/.ssh/known_hosts 2>/dev/null
              exit 0
            fi
            echo "Attempt $i/10 failed — waiting 15s..."
            sleep 15
          done
          echo "❌ Cannot reach $IP:22 after 10 attempts."
          echo "   Check: Hetzner Cloud Firewall allows port 22 from 0.0.0.0/0"
          echo "   Check: server is provisioned and running"
          echo "   Check: PRODUCTION_SERVER_IP secret contains the correct IP"
          exit 1

      - name: Create Ansible Vault password file
        run: |
          echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > studio-erp/ansible/.vault_pass
          chmod 600 studio-erp/ansible/.vault_pass

      - name: Create encrypted vault file
        env:
          VAULT_PG_PASSWORD: ${{ secrets.POSTGRESQL_PASSWORD }}
          VAULT_NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          VAULT_STRIPE_PK: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          VAULT_STRIPE_SK: ${{ secrets.STRIPE_SECRET_KEY }}
          VAULT_STRIPE_WH: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          VAULT_SENDGRID: ${{ secrets.SENDGRID_API_KEY }}
          VAULT_OPENAI: ${{ secrets.OPENAI_API_KEY }}
          VAULT_UPSTASH_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          VAULT_UPSTASH_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          VAULT_SENTRY: ${{ secrets.SENTRY_DSN }}
          VAULT_HETZNER: ${{ secrets.HETZNER_API_TOKEN }}
          VAULT_BACKUP_PASS: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
          VAULT_GRAFANA_PASS: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        run: |
          set -e
          python3 - << 'PYEOF'
          import os, yaml
          data = {
              'vault_postgresql_password': os.environ.get('VAULT_PG_PASSWORD', ''),
              'vault_nextauth_secret': os.environ.get('VAULT_NEXTAUTH_SECRET', ''),
              'vault_nextauth_url': 'https://romanoing.com',
              'vault_stripe_publishable_key': os.environ.get('VAULT_STRIPE_PK', ''),
              'vault_stripe_secret_key': os.environ.get('VAULT_STRIPE_SK', ''),
              'vault_stripe_webhook_secret': os.environ.get('VAULT_STRIPE_WH', ''),
              'vault_sendgrid_api_key': os.environ.get('VAULT_SENDGRID', ''),
              'vault_openai_api_key': os.environ.get('VAULT_OPENAI', ''),
              'vault_upstash_redis_rest_url': os.environ.get('VAULT_UPSTASH_URL', ''),
              'vault_upstash_redis_rest_token': os.environ.get('VAULT_UPSTASH_TOKEN', ''),
              'vault_sentry_dsn': os.environ.get('VAULT_SENTRY', ''),
              'vault_hetzner_api_token': os.environ.get('VAULT_HETZNER', ''),
              'vault_backup_encryption_passphrase': os.environ.get('VAULT_BACKUP_PASS', ''),
              'vault_grafana_admin_password': os.environ.get('VAULT_GRAFANA_PASS', ''),
          }
          with open('studio-erp/ansible/group_vars/production/vault.yml', 'w') as f:
              yaml.dump(data, f, default_flow_style=False, allow_unicode=True)
          PYEOF
          ansible-vault encrypt studio-erp/ansible/group_vars/production/vault.yml \
            --vault-password-file studio-erp/ansible/.vault_pass

      - name: Update inventory with server IP
        run: |
          sed -i "s/XXX.XXX.XXX.XXX/${{ secrets.PRODUCTION_SERVER_IP }}/g" studio-erp/ansible/inventory/production.yml

      - name: Rollback via Ansible
        working-directory: studio-erp/ansible
        run: |
          PREVIOUS_COMMIT=$(git rev-parse HEAD~1)
          echo "Rolling back to commit: $PREVIOUS_COMMIT"

          # Use Ansible to rollback (more reliable than direct SSH)
          ansible-playbook playbooks/application.yml \
            --vault-password-file .vault_pass \
            --tags deploy \
            --extra-vars "app_repository_version=$PREVIOUS_COMMIT" \
            -v || echo "⚠️ Rollback failed - manual intervention required"

      - name: Verify rollback
        run: |
          echo "Waiting for rollback to complete..."
          sleep 30

          # Try health check with retries
          for i in {1..5}; do
            if curl -f --connect-timeout 10 https://romanoing.com/api/health 2>/dev/null; then
              echo "✅ Rollback verified!"
              exit 0
            fi
            echo "Attempt $i/5 failed, waiting 10s..."
            sleep 10
          done

          echo "⚠️ Rollback verification failed - check server manually"
          exit 1

      - name: Get previous commit hash
        id: prev_commit
        run: echo "sha=$(git rev-parse HEAD~1)" >> $GITHUB_OUTPUT

      - name: Notify team of rollback
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.sendgrid.net
          server_port: 587
          username: apikey
          password: ${{ secrets.SENDGRID_API_KEY }}
          subject: "⚠️ Production Deployment Failed - Rollback Executed"
          to: benedetto.romano@studioromano.it
          from: deploy@studioromano.it
          body: |
            Deployment to production FAILED and automatic rollback was executed.

            Failed commit: ${{ github.sha }}
            Rolled back to: ${{ steps.prev_commit.outputs.sha }}

            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Please investigate logs and fix before retrying deployment.

      - name: Close SSH on Hetzner Cloud Firewall
        if: always()
        run: |
          if [ ! -f /tmp/hetzner_original_rules.json ] || [ ! -f /tmp/hetzner_fw_id.txt ]; then
            echo "No saved firewall state, skipping restore"
            exit 0
          fi
          API="https://api.hetzner.cloud/v1"
          TOKEN="${{ secrets.HETZNER_API_TOKEN }}"
          FW_ID=$(cat /tmp/hetzner_fw_id.txt)
          ORIGINAL_RULES=$(cat /tmp/hetzner_original_rules.json)
          HTTP_CODE=$(curl -s -o /tmp/hetzner_fw_restore.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            "$API/firewalls/$FW_ID/actions/set_rules" \
            -d "{\"rules\": $ORIGINAL_RULES}")
          if [ "$HTTP_CODE" != "201" ]; then
            echo "❌ Restore set_rules returned HTTP $HTTP_CODE"
            cat /tmp/hetzner_fw_restore.json
            exit 1
          fi
          echo "✅ Firewall rules restored"
          rm -f /tmp/hetzner_original_rules.json /tmp/hetzner_fw_id.txt \
                /tmp/hetzner_fw_get.json /tmp/hetzner_fw_set.json /tmp/hetzner_fw_restore.json

# ═══════════════════════════════════════════════════════
# Notification (success)
# ═══════════════════════════════════════════════════════

  notify-success:
    name: Notify Success
    runs-on: ubuntu-latest
    needs: [verify]
    if: success()

    steps:
      - name: Send success notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.sendgrid.net
          server_port: 587
          username: apikey
          password: ${{ secrets.SENDGRID_API_KEY }}
          subject: "✅ Production Deployment Successful"
          to: benedetto.romano@studioromano.it
          from: deploy@studioromano.it
          body: |
            Deployment to production completed successfully!

            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
            Message: ${{ github.event.head_commit.message }}

            Application: https://romanoing.com
            Monitoring: http://${{ secrets.PRODUCTION_SERVER_IP }}:3001 (Grafana)

            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}